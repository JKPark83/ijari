# 이 자리 — 로컬 self-host 스택 (OrbStack)
# Supabase 무료 티어(500MB)로 전국 데이터(~1.2GB 추정)를 감당할 수 없어 로컬로 전환.
# 앱이 쓰는 표면은 PostgREST뿐이라 supabase-swift는 URL·키 교체만으로 그대로 동작한다.
#
# PGDATA는 T31 외장 드라이브의 APFS 스파스 이미지에 둔다 (T31 자체는 ExFAT라
# Postgres 권한 요구를 못 맞춤): hdiutil attach /Volumes/T31/ijari/ijari-db.sparsebundle
name: ijari

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ijari-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ijari
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    command: postgres -c shared_buffers=512MB -c max_wal_size=2GB
    ports:
      - "127.0.0.1:5433:5432"   # ETL 적재용 (호스트 전용)
    volumes:
      - /Volumes/IjariDB/pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ijari"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.12
    container_name: ijari-postgrest
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/ijari
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    container_name: ijari-api
    ports:
      - "8000:80"               # LAN 공개 — 아이폰이 Mac IP:8000으로 접속
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - postgrest
