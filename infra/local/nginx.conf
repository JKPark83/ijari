# supabase-swift는 {url}/rest/v1/... 로 요청한다 — 접두사를 벗겨 PostgREST로 전달.
server {
    listen 80;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /health {
        return 200 'ok';
    }
}
