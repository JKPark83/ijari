name: Ijari
options:
  bundleIdPrefix: com.jkpark
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Ijari:
    type: application
    platform: iOS
    sources: [Ijari]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        DEVELOPMENT_TEAM: WDNVP9B8A9        # 무료 팀. Phase 6에서 유료 팀으로 교체
        PRODUCT_BUNDLE_IDENTIFIER: com.jkpark.ijari
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 현재 위치 주변의 자리를 지도에 보여주기 위해 사용합니다.
